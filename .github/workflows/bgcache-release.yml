name: BGCache release

# Builds the BGCache downloads and makes a DRAFT release with them. Nothing
# is public until you open the draft on the Releases page and press Publish.
#
# Start it from the Actions tab > "BGCache release" > Run workflow (type the
# version). Not on tags: publishing a release makes its tag, and that must not
# start a second draft. The release text comes from
# .github/release-notes/bgcache-<version>.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, as in bgcache/bgcache/__init__.py (e.g. 0.9.0b1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Work out the version
        id: v
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          code=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('bgcache/bgcache/__init__.py').read()).group(1))")
          if [ "$v" != "$code" ]; then echo "::error::Asked for $v but the code says $code"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Run the tests
        working-directory: bgcache
        run: python tests/run_tests.py
      - name: Build the downloads
        working-directory: bgcache
        run: python tools/build_release.py ../dist
      - name: Make the draft release (Simple and Full editions)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          v="${{ steps.v.outputs.version }}"
          notes=".github/release-notes/bgcache-$v.md"
          [ -f "$notes" ] || { echo "::error::No release notes in $notes"; exit 1; }
          if gh release view "bgcache-v$v" >/dev/null 2>&1; then echo "::error::A release bgcache-v$v already exists"; exit 1; fi
          pre=""; case "$v" in *a*|*b*|*rc*) pre="--prerelease";; esac
          gh release create "bgcache-v$v" dist/bgcache-$v-*-simple.zip dist/bgcache-$v-*-full.zip \
            --draft $pre --target "$GITHUB_SHA" \
            --title "BGCache $v" --notes-file "$notes"
